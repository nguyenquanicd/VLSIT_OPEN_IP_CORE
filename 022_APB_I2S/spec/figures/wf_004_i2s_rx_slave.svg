<text x="12" y="170" font-size="11" fill="#444">Cell = one bit clock, master clock 8 times the bit clock, two 8-bit slots, words 0xC3 and 0x5A. Inputs are synchronized in the master clock domain; the sample tick follows each rising bit clock edge by two master clocks (PARA_I2S_SYNC_DEPTH = 2); a word is pushed at the end of each slot.</text>
