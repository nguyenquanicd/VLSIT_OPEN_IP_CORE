<text x="104" y="1715" text-anchor="start" font-weight="bold">Legend</text>
<text x="284" y="1756" text-anchor="start">Interface connector (one per signal group; arrow = active to passive)</text>
<text x="104" y="1831" text-anchor="start">The enclosing frame is the top module; the two blocks are its instances. The synchronizer instances u_sync_ack and u_sync_req are inside u_src and u_dst respectively. i_ack enters u_dst; in mode 0 it passes through, in mode 1 it is registered, and in both modes u_dst returns the acknowledge to u_src as the internal net w_ack listed in the DACK row of the interface table.</text>
