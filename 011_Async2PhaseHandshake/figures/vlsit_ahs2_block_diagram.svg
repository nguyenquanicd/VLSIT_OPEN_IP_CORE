<text x="104" y="1817" text-anchor="start" font-weight="bold">Legend</text>
<text x="284" y="1858" text-anchor="start">Interface connector (one per signal group; arrow = active to passive)</text>
<text x="104" y="1933" text-anchor="start">The enclosing frame is the top module; the two blocks are its instances. The synchronizer instances u_sync_req and u_sync_ack are inside u_dst and u_src respectively. The request toggle and the bundled payload cross from u_src to u_dst on the drawn REQ connector. The acknowledge toggle and the bundled return payload cross back from u_dst to u_src and are listed in the DACK row of the interface table, because the forward and return crossings share one block boundary. Both cross-domain control signals are one-bit toggles through m_vlsit_afifo_cell_sync; both payloads are held for the whole handshake.</text>
