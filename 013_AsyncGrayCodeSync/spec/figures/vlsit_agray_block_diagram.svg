<text x="284" y="1596" text-anchor="start">Interface connector (one per signal group; arrow = active to passive)</text>
<text x="104" y="1671" text-anchor="start">The enclosing frame is the top module; the two blocks are its instances. The Gray launch register is in u_src and the n-stage synchronizer instances are in u_dst. The Gray bus crosses from u_src to u_dst on the drawn GRAY connector. Each Gray bit is a one-bit toggle through m_vlsit_afifo_cell_sync; the single-bit-change Gray property makes the multi-bit crossing safe.</text>
