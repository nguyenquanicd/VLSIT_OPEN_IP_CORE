<text x="12" y="320" font-size="11" fill="#444">Not to scale. 3 ms idle, suspend; after 5 ms idle software sets rmt_wake, the device drives K for 1 to 15 ms; hardware clears rmt_wake. XcvrSelect and TermSelect stay in the full-speed row while suspended, also for a device that was in high-speed operation, so the D+ pull-up stays on (peripheral suspend row of ULPI 1.1 Table 40, DEC-048).</text>
