<text x="12" y="320" font-size="11" fill="#444">Not to scale. Host drives SE0 for at least 50 ms with the high-speed terminations (XcvrSelect HS, TermSelect HS, OpMode 00b: host high-speed row of ULPI 1.1 Table 40, nothing transmitted, DEC-048); device Chirp K is seen (cycles 4 and 5) while the host listens in the host chirp row (OpMode 10b); the host sends alternating K and J chirps (cycles 7 to 11), then the port is enabled at high-speed.</text>
